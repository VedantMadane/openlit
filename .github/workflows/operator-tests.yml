name: Test Operator

on:
  push:
    branches: [ main, operator ]
    paths:
      - 'operator/**'
      - '.github/workflows/operator-tests.yml'
  pull_request:
    branches: [ main, operator ]
    paths:
      - 'operator/**'
      - '.github/workflows/operator-tests.yml'

env:
  GO_VERSION: "1.24"

jobs:
  unit:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v5
      
    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: ${{ env.GO_VERSION }}
        
    - name: Cache Go modules
      uses: actions/cache@v4
      with:
        path: |
          ~/.cache/go-build
          ~/go/pkg/mod
        key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
        restore-keys: |
          ${{ runner.os }}-go-
          
    - name: Download dependencies
      run: go mod download
      working-directory: ./operator
      
    - name: Run config tests
      run: |
        echo "🧪 Running config tests..."
        go test ./internal/config -v
      working-directory: ./operator
      
    - name: Run injector tests
      run: |
        echo "🧪 Running injector tests..."
        go test ./internal/injector -v
      working-directory: ./operator
      
    - name: Run observability tests  
      run: |
        echo "🧪 Running observability tests..."
        go test ./internal/observability -v
      working-directory: ./operator
      
    - name: Run webhook tests
      run: |
        echo "🧪 Running webhook tests..."
        go test ./internal/webhook -v
      working-directory: ./operator
      
    - name: Run controller tests
      run: |
        echo "🧪 Running controller tests..."
        go test ./internal/controller -v
      working-directory: ./operator
        
    - name: Generate test coverage
      run: |
        echo "📊 Generating test coverage report..."
        go test -coverprofile=coverage.out ./...
        go tool cover -html=coverage.out -o coverage.html
        go tool cover -func=coverage.out
      working-directory: ./operator

  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v5
      
    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: ${{ env.GO_VERSION }}
        
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
      
    - name: Install k3d
      run: |
        echo "📦 Installing k3d..."
        curl -s https://raw.githubusercontent.com/k3d-io/k3d/main/install.sh | bash
        k3d version
        
    - name: Create k3d cluster
      run: |
        echo "🚀 Creating k3d test cluster..."
        k3d cluster create operator-test \
          --port "8080:80@loadbalancer" \
          --wait --timeout 120s
        kubectl cluster-info
        kubectl get nodes
        kubectl version --client
        
    - name: Build operator image
      run: |
        echo "🏗️ Building operator image..."
        docker build -t ghcr.io/openlit/openlit-operator:test .
        docker images | grep openlit-operator
        # Verify image was built successfully
        docker inspect ghcr.io/openlit/openlit-operator:test > /dev/null
      working-directory: ./operator
        
    - name: Build instrumentation provider image  
      run: |
        echo "🏗️ Building instrumentation provider image..."
        docker build -t ghcr.io/openlit/openlit-ai-instrumentation:test .
        docker images | grep openlit-ai-instrumentation
        # Verify image was built successfully
        docker inspect ghcr.io/openlit/openlit-ai-instrumentation:test > /dev/null
      working-directory: ./operator/providers/openlit
        
    - name: Import images to k3d cluster
      run: |
        echo "📥 Importing images to k3d cluster..."
        # Webhook getProviderImage() hardcodes :latest for openlit provider images.
        # Tag our locally-built test images as :latest so injection can pull them in-cluster.
        docker tag ghcr.io/openlit/openlit-operator:test ghcr.io/openlit/openlit-operator:latest
        docker tag ghcr.io/openlit/openlit-ai-instrumentation:test ghcr.io/openlit/openlit-ai-instrumentation:latest
        k3d image import ghcr.io/openlit/openlit-operator:test -c operator-test
        k3d image import ghcr.io/openlit/openlit-operator:latest -c operator-test
        k3d image import ghcr.io/openlit/openlit-ai-instrumentation:test -c operator-test
        k3d image import ghcr.io/openlit/openlit-ai-instrumentation:latest -c operator-test
        
    - name: Install OpenLIT Backend
      run: |
        echo "⚙️ Installing OpenLIT backend..."
        helm repo add openlit https://openlit.github.io/helm/
        helm repo update
        helm install openlit openlit/openlit --wait --timeout=300s
        kubectl get svc openlit
        kubectl wait --for=condition=ready pod -l app=openlit --timeout=180s
        echo "✅ OpenLIT backend is ready"
        
    - name: Deploy AutoInstrumentation CRD
      run: |
        echo "📋 Deploying AutoInstrumentation CRD..."
        kubectl apply -f operator/deploy/openlit.io_autoinstrumentations.yaml
        kubectl get crd autoinstrumentations.openlit.io
        
    - name: Deploy OpenLIT Operator
      run: |
        echo "🚀 Deploying OpenLIT Operator..."
        # Update deployment to use our test images
        cp operator/deploy/openlit-operator.yaml operator/deploy/openlit-operator-test.yaml
        sed -i 's|ghcr.io/openlit/openlit-operator:latest|ghcr.io/openlit/openlit-operator:test|g' operator/deploy/openlit-operator-test.yaml
        sed -i 's|ghcr.io/openlit/openlit-ai-instrumentation:latest|ghcr.io/openlit/openlit-ai-instrumentation:test|g' operator/deploy/openlit-operator-test.yaml
        kubectl apply -f operator/deploy/openlit-operator-test.yaml
        
    - name: Wait for operator to be ready
      run: |
        echo "⏳ Waiting for operator to be ready..."
        kubectl wait --for=condition=available deployment/openlit-operator -n openlit --timeout=180s
        kubectl get pods -n openlit -l app=openlit-operator

        # Operator registers the mutating webhook at runtime; wait until it exists
        # so test pods are not created before admission injection is available.
        echo "⏳ Waiting for mutating webhook configuration..."
        timeout 120 bash -c 'until kubectl get mutatingwebhookconfiguration openlit-mutating-webhook-configuration >/dev/null 2>&1; do sleep 2; done'
        kubectl get mutatingwebhookconfiguration openlit-mutating-webhook-configuration
        # Brief settle time for API server webhook wiring
        sleep 5
        
    - name: Check operator health
      run: |
        echo "🔍 Checking operator health..."
        OPERATOR_POD=$(kubectl get pods -n openlit -l app=openlit-operator -o jsonpath='{.items[0].metadata.name}')
        echo "Operator pod: $OPERATOR_POD"
        
        # Check if operator is running
        kubectl get pod -n openlit $OPERATOR_POD
        
        # Check operator logs for startup success
        echo "=== Operator Logs ==="
        kubectl logs -n openlit $OPERATOR_POD --tail=30
        
        # Verify webhook service exists
        kubectl get svc -n openlit openlit-webhook-service
        
    - name: Test operator functionality
      run: |
        echo "🧪 Testing operator functionality..."
        # Create test AutoInstrumentation resource from example file
        kubectl apply -f operator/examples/complete-openlit-instrumentation.yaml
        
        # Verify resources were created and become Ready
        kubectl get autoinstrumentations.openlit.io -o yaml
        timeout 60 bash -c 'until kubectl get autoinstrumentations.openlit.io openlit-instrumentation -o jsonpath="{.status.conditions[?(@.type==\"Ready\")].status}" 2>/dev/null | grep -q True; do sleep 2; done' || true
        echo "✅ AutoInstrumentation resources created successfully"
        
    - name: Deploy test application with custom packages
      run: |
        echo "🚀 Deploying test application with custom packages..."
        kubectl apply -f operator/examples/test-application-deployment.yaml
        kubectl get deploy,cm -l app=openlit-test-app 2>/dev/null || true
        kubectl get deploy openlit-test-app configmap/test-application-script
        
        # IMPORTANT: `kubectl get pod -l ...` exits 0 even when items is empty.
        # Wait until at least one pod object exists (webhook may delay creation slightly).
        echo "⏳ Waiting for test application pod..."
        timeout 300 bash -c '
          until [ "$(kubectl get pods -l app=openlit-test-app -o jsonpath="{.items[*].metadata.name}" 2>/dev/null | wc -w)" -ge 1 ]; do
            echo "  still waiting for pods with label app=openlit-test-app..."
            kubectl get deploy openlit-test-app 2>/dev/null || true
            kubectl get events --field-selector involvedObject.name=openlit-test-app --sort-by=.metadata.creationTimestamp 2>/dev/null | tail -5 || true
            sleep 3
          done
        '
        kubectl get pods -l app=openlit-test-app -o wide
        
    - name: Verify instrumentation injection
      run: |
        set -euo pipefail
        echo "🔍 Verifying instrumentation injection..."

        dump_debug() {
          echo "=== DEBUG: pods in all namespaces ==="
          kubectl get pods -A -o wide || true
          echo "=== DEBUG: test app pods ==="
          kubectl get pods -l app=openlit-test-app -o wide || true
          kubectl get pods -l app=openlit-test-app -o yaml || true
          echo "=== DEBUG: describe test app ==="
          kubectl describe pod -l app=openlit-test-app || true
          echo "=== DEBUG: deployment/replicaset ==="
          kubectl get deploy,rs -l app=openlit-test-app -o wide || true
          kubectl describe deploy openlit-test-app || true
          echo "=== DEBUG: events ==="
          kubectl get events --sort-by=.metadata.creationTimestamp | tail -80 || true
          echo "=== DEBUG: operator logs ==="
          kubectl logs -n openlit -l app=openlit-operator --tail=150 || true
          echo "=== DEBUG: mutating webhooks ==="
          kubectl get mutatingwebhookconfiguration -o yaml || true
          echo "=== DEBUG: autoinstrumentations ==="
          kubectl get autoinstrumentations.openlit.io -o yaml || true
        }
        trap dump_debug ERR

        TEST_POD=$(kubectl get pods -l app=openlit-test-app -o jsonpath='{.items[0].metadata.name}')
        if [ -z "${TEST_POD}" ]; then
          echo "❌ No pod found with label app=openlit-test-app"
          exit 1
        fi
        echo "Test application pod: $TEST_POD"

        # Prefer structured check on pod spec (set at admission time)
        INIT_CONTAINERS=$(kubectl get pod "$TEST_POD" -o jsonpath='{.spec.initContainers[*].name}' || true)
        if [ -n "${INIT_CONTAINERS}" ]; then
          echo "✅ Init container detected - instrumentation injection successful"
          echo "Init containers: ${INIT_CONTAINERS}"
          kubectl get pod "$TEST_POD" -o jsonpath='{range .spec.initContainers[*]}{.name}{"\t"}{.image}{"\n"}{end}'
          kubectl describe pod "$TEST_POD" | grep -A 10 "Init Containers:" || true
        else
          echo "❌ No init container found - instrumentation injection failed"
          exit 1
        fi
        
    - name: Collect diagnostic information
      if: failure()
      run: |
        echo "🔍 Collecting diagnostic information..."
        
        echo "=== Cluster Overview ==="
        kubectl get all --all-namespaces
        kubectl get pods -A -o wide || true
        
        echo "=== Operator Status ==="
        kubectl get pods -n openlit -l app=openlit-operator || true
        
        echo "=== Operator Logs ==="
        kubectl logs -n openlit -l app=openlit-operator --tail=100 || true
        
        echo "=== Test Application Status ==="
        kubectl get pods -l app=openlit-test-app || true
        kubectl describe pod -l app=openlit-test-app || true
        kubectl get deploy,rs -l app=openlit-test-app -o wide || true
        
        echo "=== AutoInstrumentation Resources ==="
        kubectl get autoinstrumentations.openlit.io -o yaml || true

        echo "=== MutatingWebhookConfigurations ==="
        kubectl get mutatingwebhookconfiguration -o yaml || true
        
        echo "=== Events ==="
        kubectl get events --sort-by=.metadata.creationTimestamp || true
        
    - name: Cleanup
      if: always()
      run: |
        echo "🧹 Cleaning up k3d cluster..."
        k3d cluster delete operator-test || true
